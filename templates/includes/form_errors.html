{% if form.non_field_errors %}
<div class="form-errors-banner" role="alert">
    <span class="form-errors-banner__icon" aria-hidden="true">!</span>
    <div class="form-errors-banner__content">
        {% for error in form.non_field_errors %}
        <p>{{ error }}</p>
        {% endfor %}
    </div>
</div>
{% endif %}
