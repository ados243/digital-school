{% extends 'auth_base.html' %}

{% block title %}Code WhatsApp{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="auth-card__header">
        <h2>Vérifiez WhatsApp</h2>
        <p>
            Si un compte avec un numéro WhatsApp correspond à votre saisie,
            un code à 6 chiffres vient d’être envoyé. Il expire dans 10 minutes.
        </p>
    </div>
    <div class="auth-card__footer">
        <a href="{% url 'utilisateur:login' %}">Retour à la connexion</a>
    </div>
</div>
{% endblock %}
