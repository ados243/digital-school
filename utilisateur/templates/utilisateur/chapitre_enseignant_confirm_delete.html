{% extends 'portal_base.html' %}

{% block title %}Supprimer le chapitre{% endblock %}

{% block content %}
<div class="portal-hero">
    <h1>Supprimer le chapitre</h1>
    <p>Tous les sous-chapitres de ce chapitre seront aussi supprimés.</p>
</div>
<div class="panel">
    <div class="panel-body">
        <p>Confirmer la suppression de « <strong>{{ chapitre.titre }}</strong> » ?</p>
        <form method="post" style="display:flex;gap:.5rem;margin-top:1rem;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger" style="background:var(--danger);border-color:var(--danger);">Supprimer</button>
            <a href="{% url 'utilisateur:chapitre_enseignant_detail' chapitre.id %}" class="btn btn-secondary">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
