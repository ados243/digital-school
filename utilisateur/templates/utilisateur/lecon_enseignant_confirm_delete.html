{% extends 'portal_base.html' %}

{% block title %}Supprimer le sous-chapitre{% endblock %}

{% block content %}
<div class="portal-hero"><h1>Supprimer le sous-chapitre</h1></div>
<div class="panel">
    <div class="panel-body">
        <p>Confirmer la suppression de « <strong>{{ lecon.titre }}</strong> » ?</p>
        <form method="post" style="display:flex;gap:.5rem;margin-top:1rem;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger" style="background:var(--danger);border-color:var(--danger);">Supprimer</button>
            <a href="{% if chapitre %}{% url 'utilisateur:chapitre_enseignant_detail' chapitre.id %}{% else %}{% url 'utilisateur:cours_enseignant_detail' cours.id %}{% endif %}" class="btn btn-secondary">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
